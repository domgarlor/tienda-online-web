<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat de soporte</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { background: #059669; color: #fff; padding: 0.5rem 0.75rem; font-weight: 600; }
      #log { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; }
      .msg { max-width: 85%; padding: 0.4rem 0.6rem; border-radius: 0.5rem; }
      .usuario { align-self: flex-end; background: #d1fae5; }
      .agente { align-self: flex-start; background: #f3f4f6; }
      form { display: flex; gap: 0.4rem; padding: 0.5rem; border-top: 1px solid #e5e7eb; }
      input { flex: 1; padding: 0.4rem; border: 1px solid #d1d5db; border-radius: 0.25rem; }
      button { background: #059669; color: #fff; border: none; border-radius: 0.25rem; padding: 0.4rem 0.8rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>Soporte TiendaOnline</header>
    <div id="log" role="log" aria-live="polite">
      <div class="msg agente" data-testid="mensaje-agente">Hola, soy el asistente de soporte. ¿En qué puedo ayudarte?</div>
    </div>
    <form id="form">
      <label for="mensaje" hidden>Mensaje</label>
      <input id="mensaje" autocomplete="off" placeholder="Escribe tu mensaje" />
      <button type="submit">Enviar</button>
    </form>
    <script>
      const log = document.getElementById('log');
      const form = document.getElementById('form');
      const input = document.getElementById('mensaje');

      function respuesta(texto) {
        const t = texto.toLowerCase();
        if (t.includes('pedido')) return 'Puedes consultar tus pedidos en "Mis pedidos" una vez iniciada la sesión.';
        if (t.includes('envío') || t.includes('envio')) return 'El envío tarda de 2 a 4 días laborables.';
        if (t.includes('devol')) return 'Dispones de 14 días para devolver cualquier producto.';
        return 'Gracias por tu mensaje. Un agente te responderá en breve.';
      }

      function añadir(clase, texto, testid) {
        const div = document.createElement('div');
        div.className = 'msg ' + clase;
        div.textContent = texto;
        if (testid) div.dataset.testid = testid;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const texto = input.value.trim();
        if (!texto) return;
        añadir('usuario', texto, 'mensaje-usuario');
        input.value = '';
        const escribiendo = añadir('agente', 'El agente está escribiendo…', 'escribiendo');
        // Respuesta asíncrona simulada.
        setTimeout(() => {
          escribiendo.remove();
          añadir('agente', respuesta(texto), 'mensaje-agente');
        }, 1000);
      });
    </script>
  </body>
</html>
